
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fauna Sprout Robot — Production Status</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
    background: #ffffff;
    color: #1a1a1a;
    padding: 32px 40px;
    font-size: 13px;
    line-height: 1.5;
  }

  .container { max-width: 1000px; margin: 0 auto; }

  /* ── TOOLBAR ── */
  .toolbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    background: #111;
    color: #fff;
    padding: 8px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    z-index: 100;
    font-size: 0.78rem;
  }

  .toolbar-title {
    font-weight: 700;
    font-size: 0.82rem;
    margin-right: auto;
  }

  .toolbar button {
    background: #333;
    color: #fff;
    border: 1px solid #555;
    padding: 5px 14px;
    border-radius: 3px;
    font-size: 0.75rem;
    font-weight: 600;
    cursor: pointer;
    font-family: system-ui, sans-serif;
  }

  .toolbar button:hover { background: #444; }
  .toolbar button.save-btn { background: #2d7a3a; border-color: #2d7a3a; }
  .toolbar button.save-btn:hover { background: #236b2e; }
  .toolbar button.add-btn { background: #1a5276; border-color: #1a5276; }
  .toolbar button.add-btn:hover { background: #154360; }
  .toolbar button.export-btn { background: #6b4c00; border-color: #6b4c00; }
  .toolbar button.export-btn:hover { background: #573d00; }

  .toolbar .status-msg {
    font-size: 0.72rem;
    color: #8f8;
    opacity: 0;
    transition: opacity 0.3s;
  }

  .toolbar .status-msg.show { opacity: 1; }

  body { padding-top: 60px; }

  /* ── HEADER ── */
  .header {
    border-bottom: 3px solid #111;
    padding-bottom: 14px;
    margin-bottom: 20px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }

  .header h1 {
    font-size: 1.25rem;
    font-weight: 700;
    color: #111;
    letter-spacing: -0.3px;
  }

  .header .sub { font-size: 0.78rem; color: #666; margin-top: 2px; }

  .header-right {
    text-align: right;
    font-size: 0.78rem;
    color: #444;
    line-height: 1.6;
  }

  .header-right strong { color: #111; }

  /* ── SECTION ── */
  .section { margin-bottom: 22px; }

  .section-title {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: #111;
    padding-bottom: 6px;
    border-bottom: 1px solid #ccc;
    margin-bottom: 10px;
  }

  /* ── STATUS BAR ── */
  .status-bar {
    display: flex;
    gap: 24px;
    margin-bottom: 20px;
    padding: 10px 16px;
    background: #f7f7f7;
    border: 1px solid #e0e0e0;
    border-radius: 4px;
  }

  .status-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.76rem;
    font-weight: 600;
    color: #333;
    cursor: pointer;
  }

  .status-item:hover { opacity: 0.7; }

  .ind { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .ind-g { background: #2d7a3a; }
  .ind-y { background: #b8860b; }
  .ind-r { background: #b91c1c; }
  .ind-n { background: #999; }

  /* ── EDITABLE STYLING ── */
  [contenteditable="true"] {
    outline: none;
    border-radius: 2px;
    transition: background 0.15s;
  }

  [contenteditable="true"]:hover {
    background: #f5f5f0;
  }

  [contenteditable="true"]:focus {
    background: #fdfaf0;
    box-shadow: inset 0 0 0 1px #b8860b;
  }

  /* ── EXEC LIST ── */
  .exec-list { list-style: none; padding: 0; }

  .exec-list li {
    padding: 5px 0 5px 14px;
    position: relative;
    font-size: 0.84rem;
    color: #222;
    line-height: 1.55;
  }

  .exec-list li::before {
    content: '–';
    position: absolute;
    left: 0;
    color: #666;
    font-weight: 700;
  }

  .tag {
    background: #f0f0f0;
    border: 1px solid #d0d0d0;
    border-radius: 3px;
    padding: 1px 6px;
    font-weight: 600;
    font-size: 0.8rem;
    font-family: monospace;
  }

  /* ── TABLES ── */
  table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }

  th {
    background: #222;
    color: #fff;
    padding: 7px 10px;
    text-align: center;
    font-weight: 600;
    font-size: 0.73rem;
    letter-spacing: 0.4px;
    text-transform: uppercase;
  }

  th:first-child { text-align: left; }

  td {
    padding: 7px 10px;
    text-align: center;
    border-bottom: 1px solid #e5e5e5;
    font-family: monospace;
    font-size: 0.8rem;
  }

  td:first-child {
    text-align: left;
    font-family: system-ui, sans-serif;
    font-weight: 600;
    color: #222;
  }

  tr:nth-child(even) { background: #fafafa; }

  .dim { color: #bbb; }

  .today-head {
    background: #111 !important;
    border-left: 2px solid #b8860b;
    border-right: 2px solid #b8860b;
    color: #fff;
  }

  .today-cell {
    background: #fdfaf0 !important;
    border-left: 2px solid #b8860b;
    border-right: 2px solid #b8860b;
    font-weight: 700;
    color: #111;
  }

  /* ── LIMITERS ── */
  .lim-table th { background: #444; }

  .lim-table td {
    font-family: system-ui, sans-serif;
    text-align: left;
    vertical-align: top;
  }

  .lim-table .no-issues {
    color: #999;
    font-style: italic;
    text-align: center;
    padding: 12px;
  }

  .p-badge {
    display: inline-block;
    padding: 1px 7px;
    border-radius: 3px;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.3px;
    font-family: monospace;
    cursor: pointer;
  }

  .p1 { background: #fde8e8; color: #991b1b; border: 1px solid #d4a0a0; }
  .p2 { background: #fef3e2; color: #92400e; border: 1px solid #d4b896; }

  /* ── LEGEND ── */
  .leg-table th { background: #666; font-size: 0.7rem; }
  .leg-table td { font-family: system-ui, sans-serif; text-align: left; font-size: 0.78rem; }

  /* ── NOTES ── */
  .notes-box {
    background: #fafafa;
    border: 1px solid #ddd;
    border-radius: 4px;
    padding: 12px 14px;
    min-height: 60px;
    font-size: 0.82rem;
    color: #333;
    line-height: 1.6;
  }

  .n-entry { padding: 4px 0; border-bottom: 1px solid #eee; }
  .n-entry:last-child { border-bottom: none; }

  .n-date {
    font-size: 0.7rem;
    color: #888;
    font-weight: 700;
    margin-right: 6px;
    font-family: monospace;
  }

  .n-text { display: inline; }
